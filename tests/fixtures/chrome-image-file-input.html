<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Owned image file-input acceptance</title>
  <link rel="icon" href="data:,">
  <style>
    body { font: 16px system-ui; margin: 32px; max-width: 720px; }
    label, button { display: block; margin: 12px 0; padding: 10px; }
    #upload-label { border: 1px solid #aaa; width: max-content; }
    img { object-fit: contain; }
    [hidden] { display: none !important; }
    output, pre { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Owned image upload fixture</h1>
  <p>The upload event creates a local preview. Saving is a separate explicit action.</p>
  <form id="upload-form">
    <label id="upload-label" for="logo-file">Choose the community logo</label>
    <input id="logo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <button id="save-button" type="button" disabled>Save image</button>
    <button id="submit-button" type="submit">Submit form</button>
  </form>
  <output id="status">Loading fixture</output>
  <img id="logo-preview" alt="Selected community logo" width="96" height="64" hidden>
  <img id="static-image" src="/pixel.png" alt="Owned green test image" width="96" height="64">
  <img id="hidden-image" src="/pixel.png" alt="Hidden duplicate image" hidden>
  <label for="visible-file">Visible upload</label>
  <input id="visible-file" type="file" accept=".PNG">
  <input id="text-field" type="text" value="not an upload">
  <fieldset disabled><input id="fieldset-disabled" type="file" accept="image/png"></fieldset>
  <input id="disabled-file" type="file" accept="image/png" disabled>
  <input id="directory-file" type="file" webkitdirectory>
  <input id="wrong-accept" type="file" accept="image/jpeg">
  <input id="wildcard-file" type="file" accept="image/*" multiple>
  <input id="unlabelled-hidden-file" type="file" accept="image/png" hidden>
  <input id="duplicate-one" class="ambiguous-file" type="file" hidden>
  <input id="duplicate-two" class="ambiguous-file" type="file" hidden>
  <pre id="evidence"></pre>
  <script>
    'use strict';
    const scenario = new URL(location.href).searchParams.get('scenario') || 'installed';
    const input = document.getElementById('logo-file');
    const saveButton = document.getElementById('save-button');
    const preview = document.getElementById('logo-preview');
    const state = {
      scenario, events: [], saves: 0, saveAttempts: 0, submitCount: 0,
      nativeSetterCalls: 0, wrongInstanceSetterCalls: 0, pending: null,
      saved: null, selectionReady: false, error: null, pageNonce: crypto.randomUUID(),
    };
    const documentAtStart = document;
    function facts(target) {
      return { id: target?.id || null, connected: target?.isConnected ?? null,
        files: [...(target?.files || [])].map(file => ({ name: file.name, type: file.type, size: file.size, lastModified: file.lastModified })) };
    }
    function evidence() {
      const { base64, ...pendingMetadata } = state.pending || {};
      return { ...state, pending: state.pending ? pendingMetadata : null, currentInput: facts(document.getElementById('logo-file')), originalInput: facts(input),
        currentDocument: document === documentAtStart, hasFocus: document.hasFocus(), visibilityState: document.visibilityState,
        activeId: document.activeElement?.id || null,
        preview: { src: preview.currentSrc || preview.src, complete: preview.complete, naturalWidth: preview.naturalWidth, naturalHeight: preview.naturalHeight, hidden: preview.hidden } };
    }
    window.fixtureState = state;
    window.fixtureEvidence = evidence;
    const types = ['input', 'change', 'click', 'focus', 'focusin', 'submit', 'pointerdown', 'mousedown', 'keydown'];
    for (const type of types) document.addEventListener(type, event => {
      const item = { type, target: event.target?.id || null, trusted: event.isTrusted,
        cancelable: event.cancelable, defaultPrevented: event.defaultPrevented,
        hasFocus: document.hasFocus(), visibilityState: document.visibilityState };
      state.events.push(item);
      queueMicrotask(() => { item.defaultPrevented = event.defaultPrevented; });
    }, true);
    document.getElementById('upload-form').addEventListener('submit', event => { state.submitCount += 1; event.preventDefault(); });
    if (scenario === 'native-setter') {
      // An application-level own-property setter must not intercept or replace
      // the native FileList setter used by the dedicated operation.
      Object.defineProperty(input, 'files', {
        configurable: true,
        get() { return Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'files').get.call(this); },
        set() { state.wrongInstanceSetterCalls += 1; throw new Error('The instance setter must not be used'); },
      });
    }
    function mutate(change) {
      if (change === 'replace') {
        const replacement = input.cloneNode();
        replacement.value = '';
        replacement.dataset.replacement = 'true';
        input.replaceWith(replacement);
      } else if (change === 'disable') input.disabled = true;
      else if (change === 'type') input.type = 'text';
      else if (change === 'clear') input.value = '';
      else if (change === 'same-name') {
        const previous = input.files[0];
        const replacement = new File([new Uint8Array(previous.size)], previous.name, { type: previous.type, lastModified: previous.lastModified });
        const transfer = new DataTransfer(); transfer.items.add(replacement);
        Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'files').set.call(input, transfer.files);
      } else if (change === 'url') history.replaceState(null, '', location.href + '&documentChanged=1');
      else if (change === 'root') document.documentElement.replaceWith(document.documentElement.cloneNode(true));
      else if (change === 'duplicate') {
        const duplicate = input.cloneNode();
        duplicate.dataset.duplicate = 'true';
        input.parentElement.appendChild(duplicate);
      } else if (change === 'deadline') {
        const stop = performance.now() + 180;
        while (performance.now() < stop) { /* An intentionally slow owned listener. */ }
      }
    }
    input.addEventListener('input', event => {
      if (scenario === 'prevent-default') event.preventDefault();
      const mutation = /^guard-(replace|disable|type|clear|same-name|url|root|duplicate|deadline)(-microtask)?$/.exec(scenario);
      if (mutation) {
        if (mutation[2]) queueMicrotask(() => mutate(mutation[1]));
        else mutate(mutation[1]);
      }
    });
    input.addEventListener('change', event => {
      if (scenario === 'prevent-default') event.preventDefault();
      if (scenario === 'application-rejects') { state.error = 'Owned fixture rejected the selected image'; return; }
      const file = input.files?.[0];
      if (!file) return;
      state.pending = (async () => {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
        const sha256 = [...digest].map(byte => byte.toString(16).padStart(2, '0')).join('');
        let binary = '';
        for (const byte of bytes) binary += String.fromCharCode(byte);
        const selection = { name: file.name, mimeType: file.type, size: file.size, sha256, base64: btoa(binary) };
        preview.src = URL.createObjectURL(file);
        preview.hidden = false;
        await preview.decode();
        state.pending = selection;
        state.selectionReady = true;
        saveButton.disabled = false;
        document.getElementById('status').textContent = 'Image selected; review and save separately';
      })().catch(error => { state.error = error.message; });
    });
    saveButton.addEventListener('click', async () => {
      state.saveAttempts += 1;
      if (!state.selectionReady) { state.error = 'Save requires an accepted image selection'; return; }
      saveButton.disabled = true;
      try {
        const response = await fetch('/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scenario, ...state.pending, events: state.events }) });
        const saved = await response.json();
        if (!response.ok) throw new Error(saved.error || 'Fixture save failed');
        state.saves = saved.count;
        state.saved = saved.file;
        document.getElementById('status').textContent = 'Image saved';
      } catch (error) { state.error = error.message; }
    });
    fetch('/state?scenario=' + encodeURIComponent(scenario)).then(response => response.json()).then(saved => {
      state.saved = saved.file;
      state.saves = saved.count;
      if (saved.file) {
        preview.src = '/saved-image?scenario=' + encodeURIComponent(scenario);
        preview.hidden = false;
      }
      document.getElementById('status').textContent = saved.file ? 'Previously saved image' : 'No saved image';
      document.body.dataset.ready = 'true';
    }).catch(error => { state.error = error.message; document.body.dataset.ready = 'true'; });
  </script>
</body>
</html>
